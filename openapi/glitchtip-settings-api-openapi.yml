openapi: 3.2.0
info:
  title: GlitchTip Settings API
  version: 1.0.0
  description: ''
servers: []
tags:
- name: Settings
paths:
  /api/settings/:
    get:
      operationId: glitchtip_api_api_get_settings
      summary: Get Settings
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsOut'
      tags:
      - Settings
  /api/settings/{organization_slug}/:
    get:
      operationId: glitchtip_api_api_get_organization_login_settings
      summary: Get Organization Login Settings
      parameters:
      - in: path
        name: organization_slug
        schema:
          title: Organization Slug
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSettingsOut'
      description: 'Sign-in options for one organization''s own login page, including social

        apps hidden from the instance-wide login page. Responds

        200 with an empty list for unknown slugs so anonymous requests cannot

        enumerate which organizations exist.'
      tags:
      - Settings
components:
  schemas:
    SocialAppSchema:
      properties:
        scopes:
          items:
            type: string
          title: Scopes
          type: array
        brand:
          title: Brand
          type: string
        name:
          maxLength: 40
          title: Name
          type: string
        client_id:
          description: App ID, or consumer key
          maxLength: 191
          title: Client Id
          type: string
        provider:
          maxLength: 30
          title: Provider
          type: string
      required:
      - scopes
      - brand
      - name
      - client_id
      - provider
      title: SocialAppSchema
      type: object
    SettingsOut:
      properties:
        socialApps:
          items:
            $ref: '#/components/schemas/SocialAppSchema'
          title: Socialapps
          type: array
        billingEnabled:
          title: Billingenabled
          type: boolean
        iPaidForGlitchTip:
          title: Ipaidforglitchtip
          type: boolean
        enableUserRegistration:
          title: Enableuserregistration
          type: boolean
        enableSocialAppsUserRegistration:
          title: Enablesocialappsuserregistration
          type: boolean
        enableOrganizationCreation:
          title: Enableorganizationcreation
          type: boolean
        stripePublicKey:
          anyOf:
          - type: string
          - type: 'null'
          title: Stripepublickey
        plausibleUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Plausibleurl
        plausibleDomain:
          anyOf:
          - type: string
          - type: 'null'
          title: Plausibledomain
        chatwootWebsiteToken:
          anyOf:
          - type: string
          - type: 'null'
          title: Chatwootwebsitetoken
        sentryDSN:
          anyOf:
          - type: string
          - type: 'null'
          title: Sentrydsn
        sentryTracesSampleRate:
          anyOf:
          - type: number
          - type: 'null'
          title: Sentrytracessamplerate
        environment:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
        version:
          title: Version
          type: string
        serverTimeZone:
          title: Servertimezone
          type: string
        glitchtipInstanceName:
          anyOf:
          - type: string
          - type: 'null'
          title: Glitchtipinstancename
        enabledFeatures:
          items:
            type: string
          title: Enabledfeatures
          type: array
      required:
      - socialApps
      - billingEnabled
      - iPaidForGlitchTip
      - enableUserRegistration
      - enableSocialAppsUserRegistration
      - enableOrganizationCreation
      - stripePublicKey
      - plausibleUrl
      - plausibleDomain
      - chatwootWebsiteToken
      - sentryDSN
      - sentryTracesSampleRate
      - environment
      - version
      - serverTimeZone
      - glitchtipInstanceName
      - enabledFeatures
      title: SettingsOut
      type: object
    LoginSettingsOut:
      properties:
        socialApps:
          items:
            $ref: '#/components/schemas/SocialAppSchema'
          title: Socialapps
          type: array
      required:
      - socialApps
      title: LoginSettingsOut
      type: object
  securitySchemes:
    TokenAuth:
      type: http
      scheme: bearer
    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
