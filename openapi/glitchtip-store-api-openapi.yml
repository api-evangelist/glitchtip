openapi: 3.2.0
info:
  title: GlitchTip Store API
  version: 1.0.0
  description: ''
servers: []
tags:
- name: Store
paths:
  /api/{project_id}/store/:
    post:
      operationId: apps_event_ingest_api_event_store
      summary: Event Store
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventIngestOut'
      description: 'Event store is the original event ingest API from OSS Sentry but is used less often

        Unlike Envelope, it accepts only one Issue event.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventIngestSchema'
        required: true
      tags:
      - Store
