openapi: 3.2.0
info:
  title: GlitchTip Security API
  version: 1.0.0
  description: ''
servers: []
tags:
- name: Security
paths:
  /api/{project_id}/security/:
    post:
      operationId: apps_event_ingest_api_event_security
      summary: Event Security
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
      description: 'Accept Security (and someday other) issue events.

        Reformats event to make CSP browser format match more standard

        event format.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecuritySchema'
        required: true
      tags:
      - Security
components:
  schemas:
    CSPReportSchema:
      description: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy-Report-Only#violation_report_syntax
      properties:
        blocked-uri:
          title: Blocked-Uri
          type: string
        disposition:
          enum:
          - enforce
          - report
          title: Disposition
          type: string
        document-uri:
          title: Document-Uri
          type: string
        effective-directive:
          title: Effective-Directive
          type: string
        original-policy:
          anyOf:
          - type: string
          - type: 'null'
          title: Original-Policy
        script-sample:
          anyOf:
          - type: string
          - type: 'null'
          title: Script-Sample
        status-code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Status-Code
        line_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Line Number
        column_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Column Number
      required:
      - blocked-uri
      - disposition
      - document-uri
      - effective-directive
      - original-policy
      - status-code
      title: CSPReportSchema
      type: object
    SecuritySchema:
      properties:
        csp-report:
          $ref: '#/components/schemas/CSPReportSchema'
      required:
      - csp-report
      title: SecuritySchema
      type: object
  securitySchemes:
    TokenAuth:
      type: http
      scheme: bearer
    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
x-provenance:
  method: harvested
  publisher: GlitchTip
  source: https://app.glitchtip.com/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
