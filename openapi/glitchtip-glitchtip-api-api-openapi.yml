openapi: 3.2.0
info:
  title: GlitchTip API
  version: 1.0.0
  description: ''
servers: []
tags:
- name: GlitchTip API
paths:
  /api/0/:
    get:
      operationId: glitchtip_api_api_api_root
      summary: Api Root
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIRootSchema'
      description: /api/0/ gives information about the server and current user
      tags:
      - GlitchTip API
components:
  schemas:
    APIRootSchema:
      properties:
        version:
          title: Version
          type: string
        user:
          anyOf:
          - $ref: '#/components/schemas/UserSchema'
          - type: 'null'
        auth:
          anyOf:
          - $ref: '#/components/schemas/APITokenSchema'
          - type: 'null'
      required:
      - version
      - user
      - auth
      title: APIRootSchema
      type: object
    SocialAccountSchema:
      properties:
        email:
          anyOf:
          - format: email
            type: string
          - type: 'null'
          title: Email
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: ID
        provider:
          maxLength: 200
          title: Provider
          type: string
        uid:
          maxLength: 191
          title: Uid
          type: string
        lastLogin:
          format: date-time
          title: Last Login
          type: string
        dateJoined:
          format: date-time
          title: Date Joined
          type: string
      required:
      - email
      - username
      - provider
      - uid
      - lastLogin
      - dateJoined
      title: SocialAccountSchema
      type: object
    APITokenSchema:
      properties:
        id:
          title: Id
          type: integer
        label:
          title: Label
          type: string
        scopes:
          items:
            type: string
          title: Scopes
          type: array
        token:
          title: Token
          type: string
        created:
          format: date-time
          title: Created
          type: string
      required:
      - id
      - label
      - scopes
      - token
      - created
      title: APITokenSchema
      type: object
    UserSchema:
      properties:
        id:
          title: Id
          type: string
        options:
          $ref: '#/components/schemas/UserOptions'
        username:
          format: email
          title: Username
          type: string
        dateJoined:
          format: date-time
          title: Datejoined
          type: string
        email:
          format: email
          title: Email
          type: string
        hasPasswordAuth:
          title: Haspasswordauth
          type: boolean
        identities:
          items:
            $ref: '#/components/schemas/SocialAccountSchema'
          title: Identities
          type: array
        lastLogin:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Login
        isSuperuser:
          default: false
          description: Designates that this user has all permissions without explicitly assigning them.
          title: Superuser Status
          type: boolean
        isActive:
          default: true
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
          title: Active
          type: boolean
        name:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Name
      required:
      - id
      - options
      - username
      - dateJoined
      - email
      - hasPasswordAuth
      - identities
      title: UserSchema
      type: object
    UserOptions:
      properties:
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
        stacktraceOrder:
          anyOf:
          - type: integer
          - type: 'null'
          title: Stacktraceorder
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        clock24Hours:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Clock24Hours
        preferredTheme:
          anyOf:
          - type: string
          - type: 'null'
          title: Preferredtheme
      title: UserOptions
      type: object
  securitySchemes:
    TokenAuth:
      type: http
      scheme: bearer
    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
x-provenance:
  method: harvested
  publisher: GlitchTip
  source: https://app.glitchtip.com/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
