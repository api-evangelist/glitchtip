openapi: 3.2.0
info:
  title: GlitchTip Api Tokens API
  version: 1.0.0
  description: ''
servers: []
tags:
- name: API Tokens
paths:
  /api/0/api-tokens/:
    get:
      operationId: apps_api_tokens_api_list_api_tokens
      summary: List Api Tokens
      parameters:
      - in: query
        name: limit
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Number of results to return per page.
          title: Limit
        required: false
        description: Number of results to return per page.
      - in: query
        name: cursor
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The pagination cursor value.
          title: Cursor
        required: false
        description: The pagination cursor value.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/APITokenSchema'
                title: Response
                type: array
      security:
      - SessionAuth: []
      tags:
      - API Tokens
    post:
      operationId: apps_api_tokens_api_create_api_token
      summary: Create Api Token
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenSchema'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITokenIn'
        required: true
      security:
      - SessionAuth: []
      tags:
      - API Tokens
  /api/0/api-tokens/{token_id}/:
    delete:
      operationId: apps_api_tokens_api_delete_api_token
      summary: Delete Api Token
      parameters:
      - in: path
        name: token_id
        schema:
          title: Token Id
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      security:
      - SessionAuth: []
      tags:
      - API Tokens
components:
  schemas:
    APITokenSchema:
      properties:
        id:
          title: Id
          type: integer
        label:
          title: Label
          type: string
        scopes:
          items:
            type: string
          title: Scopes
          type: array
        token:
          title: Token
          type: string
        created:
          format: date-time
          title: Created
          type: string
      required:
      - id
      - label
      - scopes
      - token
      - created
      title: APITokenSchema
      type: object
    APITokenIn:
      properties:
        scopes:
          title: Scopes
          type: integer
        label:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Label
      required:
      - scopes
      title: APITokenIn
      type: object
  securitySchemes:
    TokenAuth:
      type: http
      scheme: bearer
    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
x-provenance:
  method: harvested
  publisher: GlitchTip
  source: https://app.glitchtip.com/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
