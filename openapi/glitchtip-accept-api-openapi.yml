openapi: 3.2.0
info:
  title: GlitchTip Accept API
  version: 1.0.0
  description: ''
servers: []
tags:
- name: Accept
paths:
  /api/0/accept/{org_user_id}/{token}/:
    get:
      operationId: apps_organizations_ext_api_get_accept_invite
      summary: Get Accept Invite
      parameters:
      - in: path
        name: org_user_id
        schema:
          title: Org User Id
          type: integer
        required: true
      - in: path
        name: token
        schema:
          title: Token
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInviteSchema'
      description: Return relevant organization data around an invite
      tags:
      - Accept
    post:
      operationId: apps_organizations_ext_api_accept_invite
      summary: Accept Invite
      parameters:
      - in: path
        name: org_user_id
        schema:
          title: Org User Id
          type: integer
        required: true
      - in: path
        name: token
        schema:
          title: Token
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInviteSchema'
      description: Accepts invite to organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteIn'
        required: true
      security:
      - TokenAuth: []
      - SessionAuth: []
      tags:
      - Accept
components:
  schemas:
    UserOptions:
      properties:
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
        stacktraceOrder:
          anyOf:
          - type: integer
          - type: 'null'
          title: Stacktraceorder
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        clock24Hours:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Clock24Hours
        preferredTheme:
          anyOf:
          - type: string
          - type: 'null'
          title: Preferredtheme
      title: UserOptions
      type: object
    OrganizationSchema:
      properties:
        name:
          description: The name of the organization
          maxLength: 200
          title: Name
          type: string
        id:
          title: Id
          type: string
        dateCreated:
          format: date-time
          title: Datecreated
          type: string
        status:
          additionalProperties:
            type: string
          default:
            id: active
            name: active
          title: Status
          type: object
        avatar:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          default:
            avatarType: ''
            avatarUuid: null
          title: Avatar
          type: object
        isEarlyAdopter:
          default: false
          title: Isearlyadopter
          type: boolean
        require2fa:
          default: false
          title: Require2Fa
          type: boolean
        slug:
          description: The name in all lowercase, suitable for URL identification
          maxLength: 200
          title: Slug
          type: string
        isAcceptingEvents:
          default: true
          description: 'When false, every incoming event for this organization is rejected with a 429. Set by hand only: quota enforcement uses event_throttle_rate instead, so this stays off until someone turns it back on.'
          title: Is Accepting Events
          type: boolean
        eventThrottleRate:
          default: 0
          description: Percentage of this organization's incoming events to drop. Set automatically by the quota check, which overwrites anything entered here; 100 rejects everything, as clearing is_accepting_events does.
          title: Event Throttle Rate
          type: integer
      required:
      - name
      - id
      - dateCreated
      - slug
      title: OrganizationSchema
      type: object
    AcceptInviteSchema:
      properties:
        acceptInvite:
          title: Acceptinvite
          type: boolean
        orgUser:
          $ref: '#/components/schemas/OrganizationUserOrganizationSchema'
      required:
      - acceptInvite
      - orgUser
      title: AcceptInviteSchema
      type: object
    AcceptInviteIn:
      properties:
        acceptInvite:
          title: Acceptinvite
          type: boolean
      required:
      - acceptInvite
      title: AcceptInviteIn
      type: object
    SocialAccountSchema:
      properties:
        email:
          anyOf:
          - format: email
            type: string
          - type: 'null'
          title: Email
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: ID
        provider:
          maxLength: 200
          title: Provider
          type: string
        uid:
          maxLength: 191
          title: Uid
          type: string
        lastLogin:
          format: date-time
          title: Last Login
          type: string
        dateJoined:
          format: date-time
          title: Date Joined
          type: string
      required:
      - email
      - username
      - provider
      - uid
      - lastLogin
      - dateJoined
      title: SocialAccountSchema
      type: object
    UserSchema:
      properties:
        id:
          title: Id
          type: string
        options:
          $ref: '#/components/schemas/UserOptions'
        username:
          format: email
          title: Username
          type: string
        dateJoined:
          format: date-time
          title: Datejoined
          type: string
        email:
          format: email
          title: Email
          type: string
        hasPasswordAuth:
          title: Haspasswordauth
          type: boolean
        identities:
          items:
            $ref: '#/components/schemas/SocialAccountSchema'
          title: Identities
          type: array
        lastLogin:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Login
        isSuperuser:
          default: false
          description: Designates that this user has all permissions without explicitly assigning them.
          title: Superuser Status
          type: boolean
        isActive:
          default: true
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
          title: Active
          type: boolean
        name:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Name
      required:
      - id
      - options
      - username
      - dateJoined
      - email
      - hasPasswordAuth
      - identities
      title: UserSchema
      type: object
    OrganizationUserOrganizationSchema:
      description: Organization User Serializer with Organization info
      properties:
        id:
          title: Id
          type: string
        role:
          enum:
          - member
          - admin
          - manager
          - owner
          title: Role
          type: string
        roleName:
          title: Rolename
          type: string
        dateCreated:
          format: date-time
          title: Datecreated
          type: string
        email:
          title: Email
          type: string
        user:
          anyOf:
          - $ref: '#/components/schemas/UserSchema'
          - type: 'null'
        pending:
          title: Pending
          type: boolean
        isOwner:
          title: Isowner
          type: boolean
        organization:
          $ref: '#/components/schemas/OrganizationSchema'
      required:
      - id
      - role
      - roleName
      - dateCreated
      - email
      - pending
      - isOwner
      - organization
      title: OrganizationUserOrganizationSchema
      type: object
  securitySchemes:
    TokenAuth:
      type: http
      scheme: bearer
    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
x-provenance:
  method: harvested
  publisher: GlitchTip
  source: https://app.glitchtip.com/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
