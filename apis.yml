- name: GlitchTip MCP Server
  description: >-
    Model Context Protocol (MCP) server exposing 17 tools for AI assistants to query organizations, projects,
    issues, events, performance data, alert rules, and uptime monitors. Authenticated via OAuth 2.0 with
    GlitchTip API tokens.
