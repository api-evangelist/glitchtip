- name: GlitchTip Event Intake API
  description: >-
    Sentry SDK-compatible event intake endpoint that accepts error events, performance transactions, and
    log messages from Sentry-compatible SDKs across Python, JavaScript, Ruby, PHP, Go, Java, and more.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
